# Blueprint Render.com (paket gratis): SATU service melayani portofolio + semua demo.
services:
  - type: web
    name: portofolio-greg
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: waitress-serve --host=0.0.0.0 --port=$PORT server:application
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TRUST_PROXY
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: DEMO_ADMIN_PASSWORD   # sandi khusus demo (akan terlihat publik di halaman login demo)
        sync: false
      - key: DEMO_KASIR_PASSWORD
        sync: false
