# Blueprint Render.com (paket gratis): SATU service melayani portofolio + semua demo.
services:
  - type: web
    name: portofolio-greg
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: waitress-serve --host=0.0.0.0 --port=$PORT server:application
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TRUST_PROXY
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      # Sandi demo sengaja publik: memang ditampilkan di halaman login demo. Jangan pakai sandi asli.
      - key: DEMO_ADMIN_PASSWORD
        value: demo-admin-2026
      - key: DEMO_KASIR_PASSWORD
        value: demo-kasir-2026
      - key: STOCKLAB_MAX_JOBS   # paket gratis hanya 0,1 CPU: satu backtest berat pada satu waktu
        value: "1"
